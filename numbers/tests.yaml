# Language-agnostic test fixtures for the `numbers` domain.

clamp:
  - { input: [5, 0, 10],     expected: 5 }
  - { input: [-1, 0, 10],    expected: 0 }
  - { input: [11, 0, 10],    expected: 10 }
  - { input: [0, 0, 10],     expected: 0 }
  - { input: [10, 0, 10],    expected: 10 }
  - { input: [3.5, 1.0, 4.0], expected: 3.5 }

clamp_errors:
  - { input: [5, 10, 0] }  # lo > hi

round_to:
  - { input: [7, 5],         expected: 5 }
  - { input: [8, 5],         expected: 10 }
  - { input: [7.5, 5],       expected: 10 }   # half away from zero
  - { input: [-7.5, 5],      expected: -10 }
  - { input: [0.27, 0.05],   expected: 0.25 }
  - { input: [0, 1],         expected: 0 }
  - { input: [100, 25],      expected: 100 }

round_to_errors:
  - { input: [5, 0] }
  - { input: [5, -1] }

lerp:
  - { input: [0, 10, 0],    expected: 0 }
  - { input: [0, 10, 1],    expected: 10 }
  - { input: [0, 10, 0.5],  expected: 5 }
  - { input: [10, 20, 0.25], expected: 12.5 }
  - { input: [0, 10, -1],   expected: -10 }   # extrapolation allowed
  - { input: [0, 10, 2],    expected: 20 }

is_close:
  - { input: [1.0, 1.0],             expected: true }
  - { input: [1.0, 1.0000000001],    expected: true }
  - { input: [1.0, 1.1],             expected: false }
  - { input: [0.0, 0.0],             expected: true }
  - { input: [1000000.0, 1000000.1], expected: true }   # relative tolerance kicks in

sign:
  - { input: 5,     expected: 1 }
  - { input: -5,    expected: -1 }
  - { input: 0,     expected: 0 }
  - { input: 0.0001,  expected: 1 }
  - { input: -0.0001, expected: -1 }
