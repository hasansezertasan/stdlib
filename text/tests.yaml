# Language-agnostic test fixtures for the `text` domain.

tokenize:
  - { input: "Hello, world!",     expected: ["Hello", "world"] }
  - { input: "user_name = 42",    expected: ["user_name", "42"] }
  - { input: "one two   three",   expected: ["one", "two", "three"] }
  - { input: "",                  expected: [] }
  - { input: "   ",               expected: [] }
  - { input: "café",              expected: ["caf"] }   # ASCII-only word chars
  - { input: "a-b-c",             expected: ["a", "b", "c"] }

word_count:
  - { input: "Hello, world!",     expected: 2 }
  - { input: "one two three four", expected: 4 }
  - { input: "",                  expected: 0 }
  - { input: "   ",               expected: 0 }
  - { input: "single",            expected: 1 }

sentence_split:
  - { input: "Hello. World!",     expected: ["Hello.", "World!"] }
  - { input: "Hi.",               expected: ["Hi."] }
  - { input: "  One. Two.  Three? ", expected: ["One.", "Two.", "Three?"] }
  - { input: "Wait... what?",     expected: ["Wait.", "what?"] }   # pragmatic: ellipses split
  - { input: "",                  expected: [] }
  - { input: "No terminator",     expected: ["No terminator"] }    # last sentence kept even w/o terminator
  - { input: "A!B?C.",            expected: ["A!", "B?", "C."] }

levenshtein:
  - { input: ["kitten", "sitting"], expected: 3 }
  - { input: ["", "abc"],           expected: 3 }
  - { input: ["abc", ""],           expected: 3 }
  - { input: ["", ""],              expected: 0 }
  - { input: ["abc", "abc"],        expected: 0 }
  - { input: ["flaw", "lawn"],      expected: 2 }
  - { input: ["intention", "execution"], expected: 5 }
  - { input: ["a", "b"],            expected: 1 }
