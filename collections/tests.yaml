# Language-agnostic test fixtures for the `collections` domain.
#
# `partition` and `group_by` take a callable, which YAML cannot represent
# directly. Instead, each test names a `predicate` or `key_fn` that the
# test runner is expected to provide. Recognized names:
#
#   predicates:
#     is_even      -> x % 2 == 0
#     is_positive  -> x > 0
#     is_truthy    -> bool(x)
#
#   key functions:
#     first_char   -> s[0]
#     length       -> len(x)
#     identity     -> x

chunk:
  - { input: [[1, 2, 3, 4, 5], 2],   expected: [[1, 2], [3, 4], [5]] }
  - { input: [[1, 2, 3, 4], 2],      expected: [[1, 2], [3, 4]] }
  - { input: [[], 3],                expected: [] }
  - { input: [[1, 2, 3], 5],         expected: [[1, 2, 3]] }
  - { input: [[1, 2, 3], 1],         expected: [[1], [2], [3]] }
  - { input: [[1, 2, 3, 4, 5, 6], 3], expected: [[1, 2, 3], [4, 5, 6]] }

chunk_errors:
  - { input: [[1, 2, 3], 0] }
  - { input: [[1, 2, 3], -1] }

partition:
  - input: [[1, 2, 3, 4], "is_even"]
    expected: [[2, 4], [1, 3]]
  - input: [[], "is_even"]
    expected: [[], []]
  - input: [[-2, -1, 0, 1, 2], "is_positive"]
    expected: [[1, 2], [-2, -1, 0]]
  - input: [[0, 1, "", "x", null], "is_truthy"]
    expected: [[1, "x"], [0, "", null]]

group_by:
  - input: [["apple", "ant", "bee", "bat", "cat"], "first_char"]
    expected: { a: ["apple", "ant"], b: ["bee", "bat"], c: ["cat"] }
  - input: [[], "identity"]
    expected: {}
  - input: [["a", "bb", "cc", "ddd"], "length"]
    expected: { 1: ["a"], 2: ["bb", "cc"], 3: ["ddd"] }
