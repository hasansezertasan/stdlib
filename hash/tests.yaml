# Language-agnostic test fixtures for the `hash` domain.
# All hashes are computed over the UTF-8 byte encoding of the input string.

md5_hex:
  - { input: "",         expected: "d41d8cd98f00b204e9800998ecf8427e" }
  - { input: "hello",    expected: "5d41402abc4b2a76b9719d911017c592" }
  - { input: "The quick brown fox jumps over the lazy dog",
      expected: "9e107d9d372bb6826bd81d3542a419d6" }
  - { input: "café",     expected: "07117fe4a1ebd544965dc19573183da2" }   # UTF-8 of é = 0xC3 0xA9

sha256_hex:
  - { input: "",         expected: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" }
  - { input: "hello",    expected: "2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824" }
  - { input: "abc",      expected: "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad" }
  - { input: "The quick brown fox jumps over the lazy dog",
      expected: "d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592" }

fingerprint:
  - { input: "",         expected: "e3b0c442" }
  - { input: "hello",    expected: "2cf24dba" }
  - { input: "abc",      expected: "ba7816bf" }
